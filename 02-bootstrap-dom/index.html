<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <title>Restaurante</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <section id="pedidos" class="container my-5">
                <form class="row g-3">
                    <div class="col-md-4">
                        <label for="nombre" class="form-label">Cliente</label>
                        <input id="nombre" type="text" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label for="plato" class="form-label">Plato</label>
                        <select id="plato" class="form-select">
                            <option>Ceviche</option>
                            <option>Encebollado</option>
                            <option>Corviche</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="cantidad" class="form-label">Cantidad</label>
                        <input id="cantidad" min="1" value="1" type="number" class="form-control">
                    </div>
                    <button id="btn-agregar" type="button" class="btn btn-primary">Agregar</button>
                </form>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>

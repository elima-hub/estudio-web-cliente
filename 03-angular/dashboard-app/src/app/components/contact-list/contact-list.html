<table class="table table-striped table-sm">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col">Email</th>
        </tr>
    </thead>
    <tbody>
        @for (contact of contacts; track contact.id){
               <tr app-contact-row [contact]="contact"></tr>
        } @empty{
               <tr><td colspan="3">No hay contactos</td></tr>
        }
    </tbody>
</table>
